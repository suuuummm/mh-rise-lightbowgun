<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>モンハンライズ　ライトボウガンロードマップ</title>
    <link rel="stylesheet" href="style.css">
    data;
</head>

<body>

    <header>
        <h1>モンハンライズ：サンブレイク</h1>
        <h2>ライトボウガン育成ロードマップ</h2>
    </header>

    <section class="filter-box">

        <label for="weaponMrSelect">MR選択：</label>

        <select id="weaponMrSelect">
            <option value="3">MR3</option>
            <option value="4">MR4</option>
            <option value="5">MR5</option>
            <option value="11">MR11</option>
            <option value="100">MR100</option>
        </select>

        属性:

        <select id="ammoSelect">
            <option value="全て">全て</option>
            <option value="貫通弾">貫通弾</option>
            <option value="通常弾">通常弾</option>
            <option value="散弾">散弾</option>
            <option value="火属性">火属性</option>
            <option value="水属性">水属性</option>
        </select>

        <h2>おすすめ武器</h2>
        <div id="weaponContainer"></div>

        <label for="armorMrSelect">MR選択：</label>

        <select id="armorMrSelect">
            <option value="3">MR3</option>
            <option value="6">MR6</option>
            <option value="7">MR7</option>


        </select>

        <h2>おすすめ防具</h2>
        <div id="armorContainer"></div>

        <h2>モンスター検索</h2>

        <input type="text" id="monsterSearch" placeholder="モンスター名を入力">
        <button onclick="searchMonster()">
            検索
        </button>

        <div id="monsterResult"></div>

        <section id="roadmap">

            <h2>
                MR3→MR100
                ライトボウガン育成ルート
            </h2>
        </section>
    </section>

    <script src="script.js"></script>
</body>

</html>
